<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CableNOI Lead Scraper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 16px 10px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }

    .tagline {
      font-size: 11px;
      color: #64748b;
    }

    .controls {
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-primary {
      background: #0284c7;
      color: #fff;
    }
    .btn-primary:hover { background: #0369a1; }
    .btn-primary:disabled { background: #1e3a5f; color: #475569; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    .btn-outline:hover { border-color: #64748b; color: #e2e8f0; }
    .btn-outline:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-danger {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
    }
    .btn-danger:hover { background: #450a0a; }

    .search-wrap {
      flex: 1;
      min-width: 120px;
    }

    .search-wrap input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 12px;
      padding: 6px 10px;
      outline: none;
    }
    .search-wrap input:focus { border-color: #38bdf8; }
    .search-wrap input::placeholder { color: #475569; }

    .filter-row {
      padding: 8px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
    }

    .filter-row label {
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .filter-row input[type="checkbox"] {
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .stats {
      font-size: 11px;
      color: #64748b;
      margin-left: auto;
    }

    #status {
      padding: 6px 16px;
      font-size: 11px;
      color: #94a3b8;
      background: #0f172a;
      min-height: 26px;
      border-bottom: 1px solid #1e293b;
    }

    #status.error { color: #f87171; }
    #status.success { color: #4ade80; }

    .leads-container {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: #475569;
    }

    .empty-state .icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 13px;
      line-height: 1.6;
    }

    .empty-state .hint {
      font-size: 11px;
      color: #334155;
      margin-top: 8px;
    }

    .lead-card {
      padding: 10px 16px;
      border-bottom: 1px solid #1e293b;
      transition: background 0.1s;
      position: relative;
    }

    .lead-card:hover { background: #1e293b; }

    .lead-card.relevant .lead-name::after {
      content: "MF";
      font-size: 9px;
      font-weight: 700;
      background: #0c4a6e;
      color: #38bdf8;
      border-radius: 3px;
      padding: 1px 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .lead-name {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 2px;
    }

    .lead-name a {
      color: inherit;
      text-decoration: none;
    }
    .lead-name a:hover { color: #38bdf8; }

    .lead-title {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lead-meta {
      font-size: 11px;
      color: #475569;
      display: flex;
      gap: 8px;
      margin-top: 3px;
    }

    .lead-meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .delete-btn {
      position: absolute;
      top: 8px;
      right: 10px;
      background: none;
      border: none;
      color: #334155;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 3px;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .lead-card:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: #ef4444; background: #1e293b; }
  </style>
</head>
<body>
  <header>
    <div class="brand">CableNOI Lead Scraper</div>
    <div class="tagline">Multifamily property owner leads from LinkedIn</div>
  </header>

  <div class="controls">
    <button class="btn btn-primary" id="scrapeBtn">Scrape This Page</button>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Filter leads…" />
    </div>
    <button class="btn btn-outline" id="exportBtn" disabled>Export CSV</button>
    <button class="btn btn-danger" id="clearBtn">Clear</button>
  </div>

  <div class="filter-row">
    <label>
      <input type="checkbox" id="mfOnly" />
      Multifamily matches only
    </label>
    <span class="stats" id="statsText">0 leads</span>
  </div>

  <div id="status"></div>

  <div class="leads-container" id="leadsContainer">
    <div class="empty-state">
      <div class="icon">&#128270;</div>
      <p>Navigate to a LinkedIn search, profile, or company page and click <strong>Scrape This Page</strong>.</p>
      <p class="hint">Tip: Run a LinkedIn People search filtered by title (e.g. "property owner") for best results.</p>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
