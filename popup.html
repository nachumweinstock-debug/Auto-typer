<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Human Typer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 15px;
      font-weight: 700;
      color: #a78bfa;
      letter-spacing: 0.4px;
    }

    .gear-btn {
      background: none;
      border: none;
      color: #555580;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      width: auto;
      margin: 0;
      transition: color 0.2s;
    }
    .gear-btn:hover { color: #a78bfa; background: none; }

    textarea {
      width: 100%;
      height: 110px;
      background: #16213e;
      border: 1px solid #2d2d5e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 13px;
      padding: 10px;
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }
    textarea:focus { border-color: #a78bfa; }
    textarea::placeholder { color: #444465; }

    .humanize-btn {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      border: 1px solid #7c3aed;
      border-radius: 8px;
      background: transparent;
      color: #a78bfa;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .humanize-btn:hover { background: #2a1a4e; }
    .humanize-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .divider {
      border: none;
      border-top: 1px solid #2d2d5e;
      margin: 12px 0;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-size: 12px;
      color: #9090b0;
      white-space: nowrap;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #a78bfa;
      cursor: pointer;
    }

    #speedVal {
      font-size: 12px;
      color: #a78bfa;
      min-width: 32px;
      text-align: right;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .check-row label { cursor: pointer; }

    input[type="checkbox"] {
      accent-color: #a78bfa;
      cursor: pointer;
      width: 14px;
      height: 14px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #a78bfa;
      color: #1a1a2e;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #c4b5fd; }
    button:disabled { background: #444465; cursor: not-allowed; }

    #stopBtn {
      background: #f87171;
      margin-top: 6px;
      display: none;
    }
    #stopBtn:hover { background: #fca5a5; }

    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #9090b0;
      text-align: center;
      min-height: 16px;
    }

    /* Settings panel */
    #settingsPanel {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #16213e;
      border: 1px solid #2d2d5e;
      border-radius: 8px;
    }

    #settingsPanel.open { display: block; }

    .settings-label {
      font-size: 11px;
      color: #9090b0;
      margin-bottom: 5px;
      display: block;
    }

    .api-row {
      display: flex;
      gap: 6px;
    }

    #apiKey {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #2d2d5e;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
    }
    #apiKey:focus { border-color: #a78bfa; }
    #apiKey::placeholder { color: #444465; }

    #saveApiBtn {
      padding: 6px 12px;
      font-size: 12px;
      margin: 0;
      border-radius: 6px;
      width: auto;
    }

    .settings-hint {
      font-size: 10px;
      color: #444465;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Human Typer</h2>
    <button class="gear-btn" id="gearBtn" title="Settings">&#9881;</button>
  </div>

  <textarea id="textInput" placeholder="Paste your text here..."></textarea>

  <button class="humanize-btn" id="humanizeBtn">Humanize with AI</button>

  <hr class="divider" />

  <div class="row">
    <label>Speed (WPM)</label>
    <input type="range" id="speed" min="20" max="200" value="80" />
    <span id="speedVal">80</span>
  </div>

  <div class="check-row">
    <input type="checkbox" id="typos" checked />
    <label for="typos">Simulate typos &amp; corrections</label>
  </div>

  <button id="startBtn">&#9654; Start Typing</button>
  <button id="stopBtn">&#9632; Stop</button>

  <div id="status"></div>

  <!-- Settings panel -->
  <div id="settingsPanel">
    <span class="settings-label">Claude API Key (for AI Humanizer)</span>
    <div class="api-row">
      <input type="password" id="apiKey" placeholder="sk-ant-..." />
      <button id="saveApiBtn">Save</button>
    </div>
    <p class="settings-hint">Get a key at console.anthropic.com — stored locally in your browser.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
